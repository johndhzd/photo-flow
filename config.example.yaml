# One config points at one photo-library root that holds many sessions.
root_dir: /Volumes/FastData/PhotoEdit

# Subfolders under root_dir. Defaults shown; override only if your tree differs.
raw_photos_subdir: RawPhotos          # capture folders, e.g. RawPhotos/10460308
processed_photos_subdir: ProcessedPhotos  # edited output, e.g. ProcessedPhotos/2026_03_08
tiff_subdir: TIFF                     # Capture One TIFF exports, e.g. TIFF/2026_03_08
backups_subdir: Backups               # zip output destination

# Defaults to <root_dir>/Backups/logs when omitted.
log_dir: /Volumes/FastData/PhotoEdit/Backups/logs

# Supported formats: heic, jpg, png, jxl.
default_format: heic
default_quality: 90
overwrite_existing: false

# Raw files inside each RawPhotos/<name> folder.
raw_extensions:
  - .arw
  - .cr3
  - .nef
  - .raf
  - .rw2
  - .dng

# Original camera HEIF/HEIC files that live next to the raws (Sony uses .hif).
original_heic_extensions:
  - .hif
  - .heic
  - .heif

# Files counted as "edited" inside ProcessedPhotos/<date>.
processed_extensions:
  - .heic
  - .jpg
  - .jpeg
  - .png
  - .jxl

# Optional: persist confirmed RawPhotos-folder to session-date matches so they
# do not need to be re-selected. Maps raw folder name -> YYYY_MM_DD.
session_map:
  # "10460308": 2026_03_08
